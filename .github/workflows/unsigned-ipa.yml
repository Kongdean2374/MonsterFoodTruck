name: Unsigned iPhone IPA
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: unsigned-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 50
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MFT_LAYOUT_QA: '1'
      MFT_FULL_QA: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Record environment and verify reproducible project
        run: bash Scripts/ci_environment.sh
      - name: Validate this same source SHA
        run: bash Scripts/validate.sh
      - name: Archive device app and verify unsigned IPA
        run: bash Scripts/package_ipa.sh
      - name: Upload unsigned device build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-ipa-${{ github.run_number }}-${{ github.sha }}
          retention-days: 14
          path: |
            build/delivery
            build/QA_EVIDENCE
          if-no-files-found: error
      - name: Preserve diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: build-diagnostics-${{ github.run_number }}-${{ github.sha }}
          retention-days: 14
          path: |
            build/ENVIRONMENT.txt
            build/SIMULATOR_APP_INFO.plist
            build/SIMULATOR_APP_IDENTITY.json
            build/SIMULATOR_BUNDLE_PROBE.txt
            build/BUNDLE_LAYOUT_REGRESSION.txt
            build/Validation.xcresult
            build/Journey.xcresult
            build/JOURNEY_TEST_SUMMARY.json
            build/TEST_RESULT_SUMMARY.json
            build/TEST_SUMMARY.md
            build/VALIDATION_STATUS.json
            build/RESOURCE_FAILURE
            build/LAYOUT_*.json
            build/LAYOUT_ENVIRONMENT.txt
            build/Layout-*.xcresult
            build/*.log
          if-no-files-found: error
