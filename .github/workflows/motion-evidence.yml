name: Short visual evidence for candidate 66c2929
run-name: ${{ contains(github.event.head_commit.message, '[decode-only]') && 'Decode existing 66c2929 movies (no App build or tests)' || 'Capture fixed 66c2929 motion and recipe transitions (not full-game regression)' }}
on:
  push:
    branches: [integration/full-game]
    paths: ['docs/QA/MOTION_EVIDENCE_66c2929/**', '.github/workflows/motion-evidence.yml']
permissions:
  contents: read
concurrency:
  group: motion-evidence-66c2929
  cancel-in-progress: false
jobs:
  capture:
    if: ${{ startsWith(github.event.head_commit.message, '[motion-evidence-66c2929]') && !contains(github.event.head_commit.message, '[decode-only]') }}
    runs-on: macos-15
    timeout-minutes: 45
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
      MFT_HARNESS_SHA: ${{ github.sha }}
      MFT_CAPTURE_CASES: ${{ contains(github.event.head_commit.message, '[rig-snapshots]') && 'rig-snapshots' || (contains(github.event.head_commit.message, '[crisp-only]') && 'crisp' || 'all') }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          path: qa
          persist-credentials: false
      - name: Verify explicit request and unchanged candidate product trees
        working-directory: qa
        env:
          MFT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MFT_REQUIRE_CAPTURE: '1'
        run: |
          git fetch --no-tags --depth=1 origin 66c2929dd05c28af1b0c3ec8a79805446c6dc023
          python3 docs/QA/MOTION_EVIDENCE_66c2929/route.py
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 66c2929dd05c28af1b0c3ec8a79805446c6dc023
          path: source
          persist-credentials: false
      - name: Build fixed candidate and capture the explicitly requested short cases
        timeout-minutes: 35
        run: bash qa/docs/QA/MOTION_EVIDENCE_66c2929/capture.sh "$PWD/source" "$PWD/qa"
      - name: Upload original short movies and actual frame timestamps even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-66c2929-harness-${{ github.sha }}
          path: qa/build/motion-evidence/review
          retention-days: 14
          if-no-files-found: error
      - name: Preserve original capture test diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: motion-diagnostics-66c2929-${{ github.sha }}
          path: |
            qa/build/motion-evidence/build.log
            qa/build/motion-evidence/*.xcresult
          retention-days: 14
          if-no-files-found: error
  decode-existing:
    if: ${{ startsWith(github.event.head_commit.message, '[motion-evidence-66c2929]') && contains(github.event.head_commit.message, '[decode-only]') }}
    runs-on: macos-15
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify unchanged candidate product trees
        env:
          MFT_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          MFT_REQUIRE_CAPTURE: '1'
        run: |
          git fetch --no-tags --depth=1 origin 66c2929dd05c28af1b0c3ec8a79805446c6dc023
          python3 docs/QA/MOTION_EVIDENCE_66c2929/route.py
      - name: Decode existing original movies with native Apple frameworks only
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 docs/QA/MOTION_EVIDENCE_66c2929/decode_existing.py
      - name: Preserve actual native frame exports even on failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-motion-decode-${{ github.sha }}
          path: build/native-motion-decode/review
          retention-days: 14
          if-no-files-found: error
